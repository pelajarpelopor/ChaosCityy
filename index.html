<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7856db">
<meta name="description" content="CHAOS CITY: Ripple Effect — game edukasi keselamatan lalu lintas.">
<title>CHAOS CITY — Ripple Effect</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");

:root{
  --bg:#f5f2fc;
  --paper:#fff;
  --ink:#332d4d;
  --muted:#9285a6;
  --purple:#7956dc;
  --purple-dark:#5935b4;
  --lavender:#ede4ff;
  --pink:#ffa2bc;
  --yellow:#ffd36b;
  --mint:#9bd9b7;
  --blue:#85cfdf;
  --line:#e9e0f2;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px "DM Sans",sans-serif;
}
button,input,select{font:inherit}
button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid #ffbc53;
  outline-offset:4px;
}
h1,h2,h3,.brand{font-family:"Space Grotesk",sans-serif}
h1{font-size:clamp(27px,3vw,38px);letter-spacing:-1.2px;margin:8px 0}
h2{font-size:24px;letter-spacing:-.6px;margin:0 0 14px}
h3{margin:0 0 8px;font-size:17px}
p{line-height:1.7;color:var(--muted)}
small,.small{font-size:11px}
.muted{color:var(--muted)}
.eyebrow{
  font-size:10px;
  font-weight:700;
  letter-spacing:1.7px;
  text-transform:uppercase;
}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:224px;
  padding:24px 18px;
  background:#fffdfd;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  z-index:10;
}
.logo{display:flex;align-items:center;gap:5px;margin-bottom:30px}
.guardian-logo{width:64px;height:82px;flex-shrink:0;overflow:visible}
.logo-character{transform-origin:center bottom;animation:character-hop 3.5s infinite}
.brand{font-size:20px;line-height:1.1;font-weight:700;color:#55427f;letter-spacing:-.7px}
.brand small{
  display:block;
  font:8px "DM Sans",sans-serif;
  letter-spacing:2.7px;
  margin-top:8px;
}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{
  padding:13px 16px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  color:#9a8ba9;
  transition:.2s;
}
.nav button span:first-child{font-size:21px;width:24px}
.nav button:hover{background:#f0e8fc;color:var(--purple)}
.nav button.active{
  background:var(--purple);
  color:white;
  box-shadow:0 6px 16px #7856db2c;
}
.sidebottom{margin-top:auto}
.sidecard{
  background:#eee6fb;
  padding:17px;
  margin-top:18px;
  border:1px solid #e1d3f6;
  border-radius:15px;
}
.sidecard p{font-size:11px;margin-bottom:0}
.main{
  grid-column:2;
  padding:0 34px 35px;
  width:100%;
  max-width:1600px;
  margin:auto;
}
.topbar{
  height:88px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid var(--line);
  margin-bottom:29px;
}
.topbrand,.topright{display:flex;align-items:center;gap:14px}
.topbrand .guardian-logo{display:none}
.coin{
  padding:9px 14px;
  border-radius:24px;
  border:1px solid #f0d692;
  background:#fff1c9;
  color:#a4751e;
  font-weight:700;
  white-space:nowrap;
}
.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#eadcff;
  display:grid;
  place-items:center;
}
.welcome{margin-bottom:25px}
.welcome p{margin:8px 0}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 11px;
  border-radius:20px;
  background:var(--lavender);
  color:#825cb5;
  font-size:10px;
  font-weight:700;
}
.btn{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:11px;
  background:var(--purple);
  color:white;
  font-weight:700;
  padding:13px 18px;
  border-radius:11px;
  box-shadow:0 4px 0 var(--purple-dark);
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--purple-dark)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.light{
  background:white;
  color:var(--purple);
  border:1px solid var(--line);
  box-shadow:0 3px 0 #e1d6ee;
}
.btn.yellow{
  background:var(--yellow);
  color:#885b1f;
  box-shadow:0 4px 0 #dfad3f;
}
.link{font-size:12px;color:#8b66ba;font-weight:600}
.card{
  background:white;
  border:1px solid var(--line);
  padding:22px;
  border-radius:18px;
  box-shadow:0 4px 0 #e8dff144;
}
.dashboard{
  display:grid;
  grid-template-columns:minmax(0,1fr) 280px;
  gap:23px;
}
.hero{
  position:relative;
  min-height:435px;
  background:linear-gradient(115deg,#eee4ff,#e6f4ff 70%,#d4f4e9);
  border:2px solid white;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 7px 0 #e4dcf1;
}
.hero-text{
  position:absolute;
  left:27px;
  top:32px;
  width:280px;
  z-index:3;
  pointer-events:none;
}
.hero-text button{pointer-events:auto}
.hero-text h2{font-size:39px;line-height:1.12;margin:16px 0;letter-spacing:-1.2px}
.hero-text h2 span{color:var(--purple)}
.hero-text p{font-size:12px;max-width:205px;color:#867598}
.hero-text .pill{background:#ffffffb8;font-size:9px}
.hero-footer{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  z-index:4;
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:14px 22px;
  background:#ffffffbd;
  backdrop-filter:blur(8px);
  color:#887992;
  font-size:9px;
}
.live{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#77c292;
  margin-right:5px;
  box-shadow:0 0 0 4px #77c29222;
}
.rightstack{display:flex;flex-direction:column;gap:20px}
.kiro-card{
  background:linear-gradient(#fff7dc,#fffdf5);
  border-color:#f0dfb7;
  text-align:center;
}
.kiro-card p{font-size:12px}
.kiro{
  position:relative;
  width:95px;
  height:99px;
  margin:0 auto 12px;
  animation:float 3s ease-in-out infinite;
}
.kiro-head{
  position:absolute;
  top:20px;
  left:8px;
  width:80px;
  height:56px;
  border:4px solid #9780c9;
  background:#f4edff;
  border-radius:25px;
  box-shadow:0 6px 0 #c7b7e5;
}
.kiro-face{
  position:absolute;
  inset:9px 6px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  background:#44385f;
  border-radius:15px;
}
.kiro-eye{
  width:10px;
  height:13px;
  border-radius:6px;
  background:#a2eef0;
  animation:blink 5s infinite;
}
.kiro-antenna{
  position:absolute;
  left:46px;
  top:4px;
  width:4px;
  height:17px;
  background:#a993ce;
}
.kiro-antenna:before{
  content:"";
  position:absolute;
  left:-3px;
  top:-4px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ffbf69;
}
.kiro-body{
  position:absolute;
  bottom:0;
  left:27px;
  width:43px;
  height:22px;
  border-radius:6px 6px 18px 18px;
  background:#a68ada;
}
.kiro.gold .kiro-head{
  border-color:#d5ab43;
  background:#fff3c8;
  box-shadow:0 6px 0 #e8ce83;
}
.kiro.gold .kiro-body{background:#e4bd61}
.progress{
  height:8px;
  background:#ece5f1;
  border-radius:9px;
  overflow:hidden;
  margin:13px 0;
}
.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#b093ed,#7958d5);
  border-radius:inherit;
  transition:width .5s;
}
.challenge{
  background:linear-gradient(135deg,#ffe5d9,#fff2cb);
  border-color:#f2d9b7;
}
.challenge p{font-size:12px}

/* CUSTOM FEATURE ICONS */
.quick{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin:25px 0 29px;
}
.quick button{
  min-height:149px;
  text-align:left;
  padding:18px;
  border:1px solid #e6d9f5;
  border-bottom:4px solid #cdb6ec;
  background:linear-gradient(130deg,#fff,#f0e8fc);
  border-radius:16px;
  transition:.2s;
}
.quick button:nth-child(2){
  background:linear-gradient(130deg,#fff,#def3f7);
  border-bottom-color:#9ed9e2;
}
.quick button:nth-child(3){
  background:linear-gradient(130deg,#fff,#fff0d9);
  border-bottom-color:#eaca8b;
}
.quick button:nth-child(4){
  background:linear-gradient(130deg,#fff,#ffe6ef);
  border-bottom-color:#eeb3cb;
}
.quick button:hover{transform:translateY(-5px);box-shadow:0 9px 24px #62458315}
.feature-art{display:block;width:76px;height:65px;filter:drop-shadow(0 5px 3px #5a42651f)}
.quick b{display:block;font-size:12px;margin-top:7px}
.quick small{display:block;font-size:10px;color:#a193ae;margin-top:6px}
.sectionrow{margin-bottom:16px}
.sectionrow h2{margin:0;font-size:20px}
.mission-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.missioncard{padding:0;overflow:hidden;text-align:left;transition:.2s}
.missioncard:hover{transform:translateY(-4px)}
.thumb{
  height:111px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#e9dcfc,#d9edf5);
}
.thumb .feature-art{width:104px;height:91px;transition:transform .3s}
.missioncard:hover .feature-art{transform:rotate(-6deg) scale(1.08)}
.missionbody{padding:17px}
.missionbody h3{font-size:14px;margin:9px 0}
.missionbody p{font-size:11px;margin:7px 0 12px}
.tag{
  font-size:9px;
  letter-spacing:.8px;
  color:#9b7fba;
  font-weight:700;
  text-transform:uppercase;
}
.pagehead{margin-bottom:26px}
.notice{
  padding:16px;
  border-radius:12px;
  background:#eee7fb;
  margin:18px 0;
  line-height:1.7;
  font-size:13px;
}
.footer{
  margin-top:32px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:9px;
  color:#a99eb6;
}
.mobile-nav{display:none}

/* CSS 3D CITY */
.city-stage{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  min-height:380px;
  perspective:1400px;
  touch-action:pan-y;
  background:radial-gradient(ellipse at 52% 65%,#92cdbb33,transparent 60%);
}
.hero .city-stage{
  position:absolute;
  left:25%;
  right:-8%;
  top:-20px;
  bottom:15px;
}
.city-lens{position:absolute;inset:0;perspective:1400px;cursor:grab}
.city-lens:active{cursor:grabbing}
.city-island{
  position:absolute;
  left:50%;
  top:50%;
  width:820px;
  height:620px;
  transform-style:preserve-3d;
  transform:
    translate(-50%,-50%)
    scale(var(--zoom,.64))
    rotateX(57deg)
    rotateZ(var(--spin,-34deg));
  transition:transform .12s ease-out;
}
.terrain{
  position:absolute;
  inset:0;
  background:#a5d6ab;
  border-radius:32px;
  box-shadow:0 16px 0 #6d9e8d,0 30px 0 #668b8f,20px 50px 40px #4d668b33;
  transform:translateZ(-2px);
}
.terrain:after{
  content:"";
  position:absolute;
  inset:15px;
  border:2px solid #c8e7b9;
  border-radius:24px;
}
.road3{
  position:absolute;
  background:#748098;
  transform:translateZ(1px);
  box-shadow:0 0 0 12px #dfe4e9,0 0 0 15px #a0adbd;
}
.road3.horizontal{left:0;top:270px;width:820px;height:84px}
.road3.vertical{top:0;left:365px;height:620px;width:84px}
.road3:after{content:"";position:absolute;opacity:.8}
.road3.horizontal:after{
  left:0;right:0;top:41px;height:3px;
  background:repeating-linear-gradient(90deg,#fff0bf 0 20px,transparent 20px 40px);
}
.road3.vertical:after{
  top:0;bottom:0;left:41px;width:3px;
  background:repeating-linear-gradient(0deg,#fff0bf 0 20px,transparent 20px 40px);
}
.crosswalk{
  position:absolute;
  width:65px;
  height:24px;
  background:repeating-linear-gradient(90deg,#fff8e5 0 7px,transparent 7px 12px);
  transform:translateZ(3px);
}
.garden3{
  position:absolute;
  background:#76bf94;
  border:8px solid #cce2bc;
  border-radius:50%;
  transform:translateZ(3px);
}
.garden3:after{
  content:"";
  position:absolute;
  inset:15px;
  border:9px solid #e9d9b8;
  border-radius:50%;
}
.building3{position:absolute;transform-style:preserve-3d}
.cube3{
  position:absolute;
  width:var(--w);
  height:var(--d);
  transform-style:preserve-3d;
  transform:translateZ(var(--lift,0px));
}
.cube3>i{position:absolute;display:block;backface-visibility:visible}
.roof3{
  width:var(--w);
  height:var(--d);
  transform:translateZ(var(--h));
  background:var(--roof);
  border:4px solid #ffffff55;
  border-radius:3px;
  box-shadow:inset 0 0 0 3px #00000009;
}
.front3,.back3{
  width:var(--w);
  height:var(--h);
  transform-origin:top;
  transform:rotateX(90deg);
  background-color:var(--color);
  border:1px solid #0000000c;
}
.front3{top:var(--d)}
.back3{top:0}
.side3,.left3{
  width:var(--d);
  height:var(--h);
  left:var(--w);
  transform-origin:top left;
  transform:rotateZ(90deg) rotateX(90deg);
  background:var(--side);
  border:1px solid #0000000c;
}
.left3{left:0}
.windows3{
  position:absolute;
  inset:12px 10px 18px;
  background:repeating-linear-gradient(90deg,#415d89 0 9px,transparent 9px 21px);
  mask-image:repeating-linear-gradient(0deg,black 0 13px,transparent 13px 25px);
  opacity:.8;
}
.door3{
  position:absolute;
  bottom:0;
  left:calc(50% - 8px);
  width:16px;
  height:24px;
  background:#4d567a;
  border:3px solid #ffffff55;
  border-bottom:none;
}
.roof3 span{
  display:grid;
  place-items:center;
  height:100%;
  font:bold 18px "DM Sans",sans-serif;
  color:#5b5683;
  letter-spacing:1px;
  text-shadow:0 2px white;
}
.awning3{
  position:absolute;
  top:var(--d);
  width:var(--w);
  height:18px;
  transform:translateZ(26px) rotateX(-20deg);
  background:repeating-linear-gradient(90deg,#fff4d8 0 10px,var(--color) 10px 20px);
  border-radius:0 0 4px 4px;
}
.tree3{position:absolute;width:24px;height:24px;transform-style:preserve-3d}
.tree3:before{
  content:"";
  position:absolute;
  width:7px;
  height:36px;
  left:9px;
  top:10px;
  background:#a27d65;
  transform-origin:bottom;
  transform:rotateX(-90deg);
}
.tree3:after{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#a1e1a7,#52ad85 65%,#328b76);
  transform:translateZ(45px);
  box-shadow:0 10px 0 #459f7a,0 18px 0 #429575,10px 25px 10px #356f7530;
}
.car3{
  position:absolute;
  width:46px;
  height:24px;
  top:280px;
  left:0;
  transform-style:preserve-3d;
  animation:car-east 17s linear infinite;
}
.car3.reverse{top:326px;animation:car-west 21s linear infinite;animation-delay:-9s}
.car3.north{top:0;left:420px;animation:car-north 19s linear infinite;animation-delay:-5s}
.car3 .cube3{
  --w:46px;--d:24px;--h:13px;--lift:8px;
  --roof:#ffd26a;--color:#edac48;--side:#d59142;
}
.car3.reverse .cube3{--roof:#ffa7c3;--color:#ed86aa;--side:#c96794}
.car3.north .cube3{--roof:#a39aef;--color:#877bd3;--side:#665db3}
.car3 .roof3{border-width:2px;border-radius:7px}
.cab3{
  position:absolute;
  width:25px;
  height:19px;
  left:9px;
  top:2px;
  background:linear-gradient(90deg,#728aab 0 25%,#d6e9f1 25% 75%,#607b9c 75%);
  transform:translateZ(30px);
  border-radius:5px;
  box-shadow:0 5px 0 #7e9db5;
}
.wheel3{
  position:absolute;
  width:11px;
  height:11px;
  top:24px;
  border-radius:50%;
  background:#c8d3df;
  border:3px solid #3b4257;
  transform-origin:top;
  transform:translateZ(8px) rotateX(90deg);
}
.wheel3.w1{left:5px}
.wheel3.w2{left:31px}
.car3:after{
  content:"";position:absolute;inset:1px;
  background:#3c487932;filter:blur(3px);transform:translateZ(2px);
}
.walker3{
  position:absolute;
  width:12px;height:12px;
  left:10px;top:247px;
  transform-style:preserve-3d;
  animation:person-east 32s linear infinite;
  animation-delay:var(--delay,0s);
}
.walker3>i{
  position:absolute;
  width:12px;height:24px;
  background:linear-gradient(var(--shirt,#a079df) 0 62%,#485578 62%);
  border-radius:6px 6px 2px 2px;
  transform-origin:bottom;
  transform:translateZ(12px) rotateX(-90deg);
}
.walker3>i:before{
  content:"";
  position:absolute;
  top:-9px;left:1px;width:10px;height:10px;
  border-radius:50%;
  background:#f1bf98;
  box-shadow:0 -3px 0 #745c60;
}
.walker3:after{
  content:"";position:absolute;inset:0;
  background:#3e63742b;border-radius:50%;
}
.city-pin{
  position:absolute;
  width:40px;height:40px;
  background:white;
  border:4px solid #9b7be5;
  border-radius:50% 50% 50% 4px;
  display:grid;place-items:center;
  font:bold 14px sans-serif;
  color:#7050b0;
  box-shadow:0 6px 14px #4f3b7840;
  transform-style:preserve-3d;
  transform:translateZ(120px) rotateZ(calc(-1 * var(--spin,-34deg))) rotateX(-57deg);
}
.city-pin.active{
  background:#805ce1;color:white;border-color:#eee4ff;
  box-shadow:0 0 0 9px #ad90ed44,0 6px 20px #7652be44;
}
.city-pin.locked{border-color:#b7b4c5;color:#9994ab;background:#eeedf2}
.city-pin:after{
  content:"";position:absolute;width:2px;height:45px;
  top:35px;left:15px;background:#9376c66b;pointer-events:none;
}
.explore-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
.explore-world{
  position:relative;
  border-radius:26px;
  background:linear-gradient(140deg,#e7e8fb,#d8f3ed);
  border:2px solid white;
  box-shadow:0 8px 0 #dfdaed;
  overflow:hidden;
}
.explore-world .city-stage{height:570px}
.world-label{
  position:absolute;top:22px;left:23px;z-index:4;pointer-events:none;
}
.world-label h3{font-size:22px;margin:8px 0}
.world-label .pill{background:#ffffffcc}
.world-controls{
  position:absolute;
  left:21px;right:21px;bottom:21px;
  display:flex;align-items:center;gap:7px;z-index:5;
}
.world-controls button{
  width:37px;height:37px;
  border:1px solid #e7e0f2;
  background:#ffffffeb;
  border-radius:11px;
  font-size:19px;
  box-shadow:0 3px 0 #ccc9dc;
}
.world-controls small{
  margin-left:auto;
  padding:10px;
  background:#ffffffc9;
  border-radius:10px;
  color:#7c7190;
  font-size:9px;
}
.district-detail{
  padding:24px;background:white;border:1px solid var(--line);border-radius:23px;
}
.district-detail .feature-art{width:104px;height:89px;margin-top:13px}
.district-detail h2{font-size:26px;margin:12px 0}

.no-motion *,.no-motion *:before,.no-motion *:after{

@keyframes appear{
  from{opacity:0;transform:translateY(8px)}

<script>
"use strict";

/* ========================================
   STATE & UTILITIES
======================================== */

const $ = selector => document.querySelector(selector);
const STORAGE_KEY = "chaos-city-complete-v3";

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[character]));
}

const defaults = {
  name: "Guardian",
  avatar: "🧑‍🚀",
  started: false,
  coins: 0,
  scores: {},
  academy: {},
  daily: {},
  cases: 0,
  sound: false,
  motion: !matchMedia("(prefers-reduced-motion: reduce)").matches,
  theme: "garden",
  ownedNight: false,
  ownedGold: false,
  kiroGold: false,
  lastOutcome: "new"
};

let state;

try {
  const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  state = {...defaults, ...stored};
} catch {
  state = {...defaults, scores:{}, academy:{}, daily:{}};
}

let page = "home";
let selectedDistrict = 0;
let selectedAvatar = state.avatar;
let game = null;
let gameTimer = null;
let toastTimer = null;
let previousFocus = null;
let cameraAngle = -34;
let cameraZoom = innerWidth < 700 ? .48 : .66;
let cityNight = false;

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch {
    toast("Browser ini belum mengizinkan penyimpanan progres.");
  }
}

function completedCount() {
  return Object.keys(state.scores).length;
}

function citySafety() {
  const values = Object.values(state.scores);
  return values.length
    ? Math.round(values.reduce((a,b) => a+b, 0) / values.length)
    : 50;
}

function isUnlocked(index) {
  return index < 2 || (
    completedCount() >= index &&
    citySafety() >= 70
  );
}

function todayKey() {
  const date = new Date();
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function dailyCount() {
  return state.daily[todayKey()] || 0;
}

function toast(message) {
  $(".toast")?.remove();
  clearTimeout(toastTimer);

  const element = document.createElement("div");
  element.className = "toast";
  element.setAttribute("role","status");
  element.textContent = message;
  document.body.append(element);

  toastTimer = setTimeout(() => element.remove(), 3500);
}

function confetti() {
  if (!state.motion) return;

  const colors = ["#ffd569","#ff91b2","#78cfe8","#9bdcba","#a68be8"];

  for (let i=0; i<35; i++) {
    const item = document.createElement("i");
    item.className = "confetti";
    item.style.left = Math.random()*100 + "%";
    item.style.background = colors[i % colors.length];
    item.style.animationDelay = Math.random()*.6 + "s";
    item.style.borderRadius = i % 3 === 0 ? "50%" : "2px";
    document.body.append(item);
    setTimeout(() => item.remove(), 3600);
  }
}

function beep() {
  if (!state.sound) return;

  try {
    const AudioClass = window.AudioContext || window.webkitAudioContext;
    const audio = new AudioClass();
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.frequency.value = 540;
    gain.gain.value = .035;

    oscillator.start();
    oscillator.stop(audio.currentTime+.1);
    setTimeout(() => audio.close(), 300);
  } catch {}
}

  ];

  return `

function bindCityDrag() {
  document.querySelectorAll(".city-lens").forEach(lens => {
    let dragging = false;
    let startX = 0;
    let initialAngle = 0;

    lens.addEventListener("pointerdown", event => {
      if (event.target.closest("button")) return;

      const island = lens.querySelector(".city-island");
      dragging = true;
      startX = event.clientX;
      initialAngle = parseFloat(island.style.getPropertyValue("--spin"));
      if (!Number.isFinite(initialAngle)) initialAngle = -34;

      lens.setPointerCapture(event.pointerId);
    });

    lens.addEventListener("pointermove", event => {
      if (!dragging) return;

      const angle = initialAngle+(event.clientX-startX)*.35;
      lens.querySelector(".city-island").style.setProperty("--spin",angle+"deg");

      if (lens.closest(".explore-world")) cameraAngle = angle;
    });

    lens.addEventListener("pointerup",() => dragging=false);
    lens.addEventListener("pointercancel",() => dragging=false);
  });
}

function cameraControl(action) {
  const island = $(".explore-world .city-island");
  if (!island) return;

  if (action==="left") cameraAngle-=20;
  if (action==="right") cameraAngle+=20;
  if (action==="in") cameraZoom=Math.min(1.05,cameraZoom+.1);
  if (action==="out") cameraZoom=Math.max(.3,cameraZoom-.1);

  if (action==="reset") {
    cameraAngle=-34;
    cameraZoom=innerWidth<700 ? .48 : .66;
  }

  if (action==="night") {
    cityNight=!cityNight;
    $(".explore-world").classList.toggle("night-diorama",cityNight);
  }

  island.style.setProperty("--spin",cameraAngle+"deg");
  island.style.setProperty("--zoom",cameraZoom);
}

function modal(html) {
  if (!$("#overlay").innerHTML) previousFocus=document.activeElement;

  $("#overlay").innerHTML=`
    <div class="modalbg">
      <section class="modal" role="dialog" aria-modal="true" aria-label="Panel permainan">
        <button class="close" onclick="closeModal()" aria-label="Tutup">×</button>
        ${html}
      </section>
    </div>`;

  document.body.style.overflow="hidden";
  $("#overlay .close").focus();
}

function stopGame() {
  clearInterval(gameTimer);
  gameTimer=null;
  game=null;
}

function closeModal() {
  stopGame();
  $("#overlay").innerHTML="";
  document.body.style.overflow="";
  if (previousFocus?.isConnected) previousFocus.focus();
}

function selectMission(index) {
  if (!isUnlocked(index)) {
    toast(`Butuh ${index} misi selesai dan rata-rata Safety minimal 70.`);
    return;
  }

  if (!state.started) {
    onboarding();
    return;
  }

  launchMission(index);
}

function launchMission(index) {
  stopGame();
  const m=missions[index];

  modal(`
    <span class="eyebrow">${m.district} / Mission 0${index+1}</span>
    <h2>${m.name}</h2>
    <div class="notice">${m.goal}</div>

    ${m.type==="light" ? `
      <label for="lightContext">Konteks latihan</label>
      <select id="lightContext">
        <option value="far">Masih jauh: 95 meter dari garis henti</option>
        <option value="near">Sangat dekat: 6 meter dari garis henti</option>
      </select>
    ` : ""}

    <div class="gameview">
      <canvas id="road" width="700" height="350"
              aria-label="Simulasi lalu lintas dengan kendaraan pemain"></canvas>
      <div class="hud">
        <span id="speed">36 km/jam</span>
        <span id="distance">95 m ke marka</span>
        <span id="gameState">SIAP</span>
      </div>
    </div>

    <p id="gameHint" class="small">
      Tekan Mulai Simulasi. Gunakan tombol atau keyboard:
      ↑ akselerasi, ↓ rem, S sein, H klakson.
    </p>

    <div id="gameButtons">
      <button class="btn" onclick="beginMission(${index})">▷ Mulai simulasi</button>
    </div>`);

  drawRoad({
    index,x:0,speed:10,time:0,signal:false,lights:false,
    gap:2,ended:false,mode:"far"
  });
}

function beginMission(index) {
  const mode=$("#lightContext")?.value||"far";
  if ($("#lightContext")) $("#lightContext").disabled=true;

  game={
    index,mode,
    x:mode==="near" ? 89 : 0,
    speed:10,
    time:0,
    signal:false,
    lights:false,
    gap:2,
    rewinds:3,
    history:[],
    timelines:[],
    ended:false,
    score:null,
    message:"",
    accelerated:false,
    emergencyBrake:false
  };

  $("#gameHint").textContent=mode==="near"
    ? "Mode observasi: jarak hanya 6 m dan simpang telah diperiksa kosong. Nilai pilihanmu tanpa batas waktu. Jangan menambah kecepatan."
    : "Amati kondisi lalu gunakan kontrol. Setiap klik rem mengurangi kecepatan.";

  renderControls();
  gameTimer=setInterval(gameTick,100);
  drawRoad(game);
}

function renderControls() {
  if (!game) return;
  const g=game;
  const type=missions[g.index].type;

  let extra="";

  if (g.mode==="near") {
    extra=`<button class="btn yellow" onclick="control('continue')">Lanjut terkendali →</button>`;
  } else if (type==="ambulance") {
    extra=`<button class="btn" onclick="control('yield')">Beri jalan →</button>`;
  } else if (type==="night") {
    extra=`<button class="btn" onclick="control('lights')">☀ Lampu</button>`;
  } else if (type==="parking") {
    extra=`<button class="btn" onclick="chooseParking()">Pilih parkir →</button>`;
  }

  $("#gameButtons").innerHTML=`
    <div class="controls">
      <button onclick="control('accelerate')">↑ Akselerasi</button>
      <button onclick="control('brake')">↓ Rem</button>
      <button onclick="control('signal')">↔ Sein</button>
      <button onclick="control('horn')">♬ Klakson</button>
    </div>
    <div class="row wrap">
      <button class="btn light" onclick="rewindMission()" ${g.rewinds<1 ? "disabled" : ""}>
        ↶ Rewind 10s (${g.rewinds})
      </button>
      ${extra}
    </div>`;
}

function control(action) {
  const g=game;
  if (!g||g.ended) return;

  beep();

  switch(action) {
    case "accelerate":
      g.speed=Math.min(22,g.speed+3);
      g.accelerated=true;
      break;

    case "brake":
      if (g.mode==="near"&&g.speed>5) g.emergencyBrake=true;
      g.speed=Math.max(0,g.speed-3);
      break;

    case "signal":
      g.signal=!g.signal;
      break;

    case "lights":
      g.lights=!g.lights;
      break;

    case "horn":
      $("#gameHint").textContent="KIRO: Klakson bukan hak untuk memaksa pengguna jalan lain menyingkir.";
      break;

    case "yield":
      finishMission(
        g.signal&&g.speed<=4 ? 95 : 40,
        g.signal&&g.speed<=4
          ? "Kamu memberi ruang untuk ambulans dengan manuver terkendali."
          : "Manuver terlalu cepat atau tanpa sein sulit diantisipasi pengguna lain."
      );
      break;

    case "continue":
      const safe=!g.accelerated&&!g.emergencyBrake;
      finishMission(
        safe ? 90 : 45,
        safe
          ? "Dalam skenario simpang kosong dan jarak sangat dekat ini, kamu melanjutkan terkendali tanpa menambah kecepatan."
          : "Situasi ini membutuhkan pengamatan dan kendali, bukan akselerasi atau pengereman mendadak."
      );
      break;
  }

  if (game&&!game.ended) drawRoad(game);
}

function snapshotGame(g) {
  return {
    x:g.x,speed:g.speed,time:g.time,
    signal:g.signal,lights:g.lights,gap:g.gap,
    accelerated:g.accelerated,
    emergencyBrake:g.emergencyBrake
  };
}

function gameTick() {
  const g=game;
  if (!g||g.ended) return;

  g.history.push(snapshotGame(g));
  if (g.history.length>101) g.history.shift();

  g.time+=.1;

  if (g.mode==="near") {
    if (g.speed===0) {
      finishMission(
        45,
        "Pengereman mendadak ketika jarak sangat dekat dapat meningkatkan risiko. Pertimbangkan kembali konteks yang diberikan."
      );
    } else {
      drawRoad(g);
    }
    return;
  }

  g.x+=g.speed*.1;
  g.gap=Math.min(6,Math.max(.3,g.gap+(10-g.speed)*.012));

  const type=missions[g.index].type;

  if (["light","cross","night"].includes(type)&&g.speed===0) {
    if (type==="night"&&!g.lights) {
      $("#gameHint").textContent="Kendaraan sudah berhenti. Nyalakan lampu agar terlihat pengguna jalan lain.";
    } else if (g.x<95) {
      finishMission(95,"Kamu berhenti sebelum marka dan menjaga ruang penyeberangan.");
    }
  }

  if (g.ended) return;

  if (type==="highway"&&g.time>=8) {
    finishMission(
      g.gap>=3 ? 95 : 40,
      g.gap>=3
        ? "Celah yang cukup memberi waktu untuk bereaksi."
        : "Jarak terlalu dekat ketika kendaraan di depan melambat."
    );
    return;
  }

  if (g.x>=95&&type!=="highway") {
    finishMission(35,"Kamu memasuki area konflik tanpa menyediakan ruang aman. Terjadi situasi hampir bertabrakan.");
    return;
  }

  if (g.time>=30) {
    finishMission(55,"Situasi belum selesai. Coba kembali menggunakan tindakan yang sesuai petunjuk.");
    return;
  }

  drawRoad(g);
}

function drawRoad(g) {
  const canvas=$("#road");
  if (!canvas) return;

  const ctx=canvas.getContext("2d");
  const type=missions[g.index].type;
  const night=type==="night";

  ctx.fillStyle=night ? "#30334e" : "#dcebd7";
  ctx.fillRect(0,0,700,350);

  const colors=["#af9be5","#ffbd8f","#83cbdc","#f1a3bd"];

  for(let i=0;i<7;i++){
    const x=15+i*105;
    ctx.fillStyle=night ? "#565378" : colors[i%4];
    ctx.fillRect(x,16,69,63);
    ctx.fillStyle=night ? "#f9dc86" : "#fdf0cb";
    ctx.fillRect(x+11,27,17,20);
    ctx.fillRect(x+39,27,17,20);
    ctx.fillStyle="#6a628f";
    ctx.fillRect(x+30,56,15,23);
  }

  ctx.fillStyle="#7d849b";
  ctx.fillRect(0,108,700,140);
  ctx.fillRect(515,0,105,350);

  ctx.fillStyle="#c7c3da";
  ctx.fillRect(0,90,510,15);
  ctx.fillRect(0,251,510,16);

  ctx.strokeStyle="#fff3c9";
  ctx.lineWidth=3;
  ctx.setLineDash([22,17]);
  ctx.beginPath();
  ctx.moveTo(0,178);
  ctx.lineTo(700,178);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle="#fff5df";
  for(let y=115;y<244;y+=22) ctx.fillRect(482,y,22,12);
  ctx.fillRect(470,111,4,61);

  const px=65+Math.min(g.x/95,1.1)*402;

  if(night&&g.lights){
    ctx.fillStyle="#ffeaa655";
    ctx.beginPath();
    ctx.moveTo(px+58,126);
    ctx.lineTo(px+190,98);
    ctx.lineTo(px+190,186);
    ctx.lineTo(px+58,154);
    ctx.fill();
  }

  ctx.fillStyle="#7756d5";
  ctx.fillRect(px,126,58,29);
  ctx.fillStyle="#bde7ed";
  ctx.fillRect(px+32,130,15,21);
  ctx.fillStyle="#403a5d";
  ctx.fillRect(px+8,122,12,5);
  ctx.fillRect(px+8,154,12,5);

  if(g.signal){
    ctx.fillStyle="#ffd15a";
    ctx.fillRect(px+51,126,7,7);
  }

  const otherX=610-(g.time*22)%740;
  ctx.fillStyle="#ffad97";
  ctx.fillRect(otherX,199,49,27);
  ctx.fillStyle="#647292";
  ctx.fillRect(otherX+6,203,14,19);

  ctx.fillStyle="#49445f";
  ctx.fillRect(451,51,25,45);
  ctx.fillStyle=g.time<6||g.mode==="near" ? "#ffd469" : "#ff7a8f";
  ctx.beginPath();
  ctx.arc(463.5,74,7,0,Math.PI*2);
  ctx.fill();

  ctx.font="25px sans-serif";
  if(type==="ambulance"){
    ctx.fillText("🚑",Math.max(0,px-85),153);
  }else{
    ctx.fillText("🚶",523,91);
  }

  ctx.font="12px sans-serif";
  ctx.fillStyle=night ? "#dfd8f2" : "#6a6484";
  ctx.fillText("RUANG AMAN • AMATI SEKITAR",21,295);
  ctx.fillText(missions[g.index].district,21,322);

  $("#speed").textContent=Math.round(g.speed*3.6)+" km/jam";
  $("#distance").textContent=type==="highway"
    ? g.gap.toFixed(1)+" detik jarak"
    : Math.max(0,Math.round(95-g.x))+" m ke marka";
  $("#gameState").textContent=g.ended
    ? "SELESAI"
    : g.time.toFixed(1)+"s"+(g.signal ? " · SEIN" : "");
}

function chooseParking() {
  if(!game||game.ended) return;

  if(game.speed>0){
    toast("Berhenti terkendali dahulu sebelum memilih tempat parkir.");
    return;
  }

  $("#gameHint").innerHTML=`
    <div class="choices">
      <button onclick="finishMission(30,'Parkir di lajur menghalangi pesepeda dan kendaraan darurat.')">
        Parkir di jalur utama
      </button>
      <button onclick="finishMission(game.signal?95:70,'Kantong parkir menjaga akses warga tetap terbuka. Gunakan sein sebelum bermanuver.')">
        Parkir di kantong parkir
      </button>
    </div>`;
}

function finishMission(score,message) {
  const g=game;
  if(!g||g.ended) return;

  clearInterval(gameTimer);
  gameTimer=null;
  g.ended=true;
  g.score=score;
  g.message=message;

  const safe=score>=70;
  const m=missions[g.index];
  const chain=safe
    ? m.chain
    : ["Tindakan berisiko","Pengguna lain terhalang","Arus kota terganggu","Risiko keselamatan naik"];

  const previous=g.timelines.at(-1);

  drawRoad(g);

  $("#gameHint").innerHTML=`
    <b>${safe ? "✧ Pilihan yang melindungi" : "↶ Masih bisa diperbaiki"} · ${score}/100</b>
    <br>${escapeHTML(message)}`;

  $("#gameButtons").innerHTML=`
    <div class="ripple ${safe ? "" : "bad"}">
      ${chain.map((step,i) => `<div><b>0${i+1}</b><br>${step}</div>`).join("")}
    </div>

    <div class="notice">
      KIRO: ${m.lesson}
      ${g.mode==="near"
        ? "<br><b>Konteks khusus:</b> simpang pada latihan ini sudah diperiksa kosong. Ini bukan izin umum menerobos lampu."
        : ""}
    </div>

    ${previous ? `
      <table>
        <thead><tr><th>Timeline A</th><th>Timeline B</th></tr></thead>
        <tbody>
          <tr>
            <td>
              ${previous.score===null ? "Belum selesai" : previous.score+"/100"}<br>
              ${escapeHTML(previous.message)}
            </td>
            <td>${score}/100<br>${escapeHTML(message)}</td>
          </tr>
        </tbody>
      </table>
    ` : ""}

    <div class="row wrap">
      <button class="btn light" onclick="rewindMission()" ${g.rewinds<1 ? "disabled" : ""}>
        ↶ Rewind 10s (${g.rewinds})
      </button>
      <button class="btn" onclick="saveMissionResult()">
        ${safe ? "Simpan & klaim reward →" : "Selesai & evaluasi →"}
      </button>
    </div>`;
}

function rewindMission() {
  const g=game;
  if(!g||g.rewinds<1) return;

  clearInterval(gameTimer);

  g.timelines.push({
    score:g.score,
    message:g.message||"Keputusan di tengah perjalanan."
  });

  const snapshot=g.history[0]||{
    x:g.mode==="near" ? 89 : 0,
    speed:10,time:0,signal:false,lights:false,gap:2,
    accelerated:false,emergencyBrake:false
  };

  g.rewinds--;

  Object.assign(g,snapshot,{
    ended:false,score:null,message:"",history:[]
  });

  $("#gameHint").textContent="Waktu diputar kembali hingga 10 detik. Coba tindakan yang berbeda.";
  renderControls();
  drawRoad(g);
  gameTimer=setInterval(gameTick,100);
}

function saveMissionResult() {
  const g=game;
  if(!g) return;

  if(g.score>=70){
    const first=!state.scores[g.index];
    state.scores[g.index]=Math.max(state.scores[g.index]||0,g.score);
    state.lastOutcome="safe";
    if(first) state.coins+=100;

    saveState();
    closeModal();
    render();
    confetti();

    if(completedCount()===6){
      showEnding();
    }else{
      toast(first ? "+100 Guardian Coins! Distrik semakin aman." : "Skor terbaik tersimpan. Hadiah misi hanya sekali.");
    }
  }else{
    state.lastOutcome="risk";
    saveState();
    closeModal();
    render();
    toast("Misi belum pulih. Coba lagi dan raih skor minimal 70.");
  }
}

function showEnding() {
  modal(`
    ${kiro()}
    <span class="eyebrow">Campaign Complete</span>
    <h2>Chaos City, restored! 🎉</h2>
    <p>
      Keenam distrik kembali terhubung dengan lebih aman.
      Sekolah, rumah sakit, dan perumahan kini berbagi jalan dengan lebih baik.
    </p>
    <div class="notice">
      <b>Ending: Kota Saling Menjaga</b><br>
      City Safety: ${citySafety()}%<br>
      Setiap keputusan kecilmu menjadi perubahan bersama.
    </div>
    <button class="btn" onclick="navigate('profile')">Lihat perjalananmu →</button>`);
}

let foundEvidence=new Set();
let chronologyOrder=[];

function openDetective() {
  foundEvidence=new Set();
  chronologyOrder=[];

  modal(`
    <span class="eyebrow">Traffic Detective / Case 001</span>
    <h2>Misteri jalur yang menyempit.</h2>
    <p>Ambulans tertahan di Jalan Taman. Periksa semua sumber bukti sebelum menyimpulkan penyebab.</p>

    <div class="scene-emoji">🚑　🚙　🚗<br>🌳　🅿️　🚲</div>

    <div class="evidence">
      ${["Rekaman CCTV","Marka jalan","Posisi mobil","Saksi warga"].map((label,i) => `
        <button id="evidence${i}" onclick="inspectEvidence(${i})">🔍 ${label}</button>
      `).join("")}
    </div>

    <div id="clue" class="notice">Klik sumber bukti untuk memeriksanya.</div>
    <button class="btn" onclick="openChronology()">Susun kronologi →</button>`);
}

function inspectEvidence(index) {
  foundEvidence.add(index);
  $("#evidence"+index).classList.add("found");

  const clues=[
    "CCTV: 08:12 mobil berhenti di lajur. 08:13 antrean terbentuk. 08:14 ambulans tiba. Tidak ada rekaman sebelum 08:12.",
    "Marka menunjukkan kantong parkir di sisi kiri. Lajur aktif bukan kantong parkir.",
    "Separuh mobil berada di lajur aktif. Sepeda dan mobil lain harus bergantian lewat.",
    'Saksi: “Sepertinya pengemudi sedang menelepon.” Ia tidak melihat layar telepon. Ini dugaan, bukan bukti penggunaan telepon.'
  ];

  $("#clue").textContent=clues[index];
}

function openChronology() {
  if(foundEvidence.size<4){
    toast("Periksa keempat sumber bukti dahulu.");
    return;
  }

  chronologyOrder=[];

  modal(`
    <h2>Susun urutan kejadian.</h2>
    <p>Klik peristiwa dari yang paling awal.</p>
    <div class="choices">
      <button onclick="addChronology(2,this)">Ambulans tiba dan tertahan.</button>
      <button onclick="addChronology(0,this)">Mobil berhenti di lajur aktif.</button>
      <button onclick="addChronology(1,this)">Antrean kendaraan terbentuk.</button>
    </div>
    <div id="chronologyInfo" class="notice">0/3 kejadian disusun.</div>`);
}

function addChronology(index,button) {
  chronologyOrder.push(index);
  button.disabled=true;
  $("#chronologyInfo").textContent=chronologyOrder.length+"/3 kejadian disusun.";

  if(chronologyOrder.length<3) return;

  if(chronologyOrder.join(",")!=="0,1,2"){
    $("#chronologyInfo").innerHTML=`
      Periksa waktu CCTV: 08:12 → 08:13 → 08:14.<br>
      <button class="btn light" style="margin-top:12px" onclick="openChronology()">Susun ulang</button>`;
    return;
  }

  modal(`
    <h2>Kesimpulan mana yang didukung bukti?</h2>
    <div class="choices">
      <button onclick="toast('Penggunaan telepon dan motif pengemudi belum terbukti.')">
        Pengemudi menelepon dan sengaja menghambat ambulans.
      </button>
      <button onclick="solveCase()">
        Mobil mempersempit lajur; antrean yang terbentuk menghambat ambulans.
      </button>
      <button onclick="toast('Tidak ada bukti kegagalan lampu lalu lintas dalam rekaman.')">
        Lampu lalu lintas rusak.
      </button>
    </div>`);
}

function solveCase() {
  const first=!state.cases;
  state.cases=1;
  if(first) state.coins+=100;
  saveState();
  confetti();

  modal(`
    ${featureArt(4)}
    <h2>Case Solved · 100/100</h2>
    <p>Kamu memeriksa empat bukti, menyusun kronologi, dan membedakan fakta dari dugaan.</p>
    <div class="notice">
      Mobil menghalangi lajur → antrean → ambulans tertahan.<br>
      Motif pengemudi tidak dapat dipastikan dari bukti yang tersedia.
    </div>
    <button class="btn" onclick="closeModal();render()">
      ${first ? "+100 coins · " : ""}Tutup kasus ✓
    </button>`);
}

function showRole(role) {
  const stories={
    motor:'Pengendara motor: “Aku hanya maju sedikit.” Tetapi roda depanmu menutup ruang penyeberangan.',
    walker:"Pejalan kaki: motor menutup jalurmu. Menunggu lebih aman daripada memaksa masuk ke arus kendaraan.",
    bike:"Pesepeda: orang yang menghindari motor bisa masuk ke jalurmu. Perlambat dan beri ruang.",
    car:"Pengemudi mobil: motor di marka membatasi pandangan terhadap pejalan kaki. Jangan mendahului sembarangan.",
    ambulance:"Pengemudi ambulans: ruang simpang menyempit. Sirene tidak menghilangkan kebutuhan mengamati sekitar."
  };

  $("#roleScene").textContent=stories[role];

/* ========================================
   ROAD ACADEMY
======================================== */

let signIndex=0;
let dangerFound=new Set();
let puzzleStep=0;

function openAcademy(type) {
  if(type==="sign"){
    signIndex=0;
    showSign();
    return;
  }

  if(type==="danger"){
    dangerFound=new Set();

    modal(`
      <span class="eyebrow">Spot the Danger</span>
      <h2>Temukan tiga potensi bahaya.</h2>
      <p>Klik objek yang memerlukan perhatian sebelum melanjutkan perjalanan.</p>
      <div class="evidence">
        <button onclick="findDanger(0,true,this)">🚪 Pintu mobil terbuka</button>
        <button onclick="findDanger(1,false,this)">🌳 Pohon di taman</button>
        <button onclick="findDanger(2,true,this)">⚽ Bola di tepi jalan</button>
        <button onclick="findDanger(3,true,this)">🛢️ Tumpahan di jalan</button>
        <button onclick="findDanger(4,false,this)">🪑 Bangku taman</button>
      </div>
      <div id="academyInfo" class="notice">0/3 bahaya ditemukan.</div>
      <div id="academyFinish"></div>`);
    return;
  }

  puzzleStep=0;

  modal(`
    <span class="eyebrow">Intersection Puzzle</span>
    <h2>Dua arus. Satu persimpangan.</h2>
    <p>Lewatkan arus A lalu B. Beri fase semua merah untuk pengosongan simpang di antaranya.</p>
    <div id="junction" class="scene-emoji">🚙 A　🚦　B 🚕</div>
    <div class="controls">
      <button onclick="puzzleAction('A')">A hijau</button>
      <button onclick="puzzleAction('red')">Semua merah</button>
      <button onclick="puzzleAction('B')">B hijau</button>
      <button onclick="puzzleAction('both')">Keduanya hijau</button>
    </div>
    <div id="academyInfo" class="notice">Kedua arus sedang menunggu.</div>`);
}

function showSign() {
  const signs=[
    {symbol:"⛔",right:"Jangan masuk dari arah ini.",wrong:"Boleh masuk jika jalan terlihat kosong."},
    {symbol:"🛑",right:"Berhenti dan amati sebelum melanjutkan.",wrong:"Cukup membunyikan klakson."},
    {symbol:"🚫 🅿️",right:"Cari tempat parkir yang diperbolehkan.",wrong:"Parkir sebentar di sini."}
  ];

  const s=signs[signIndex];
  const correct=`<button onclick="correctSign()">${s.right}</button>`;
  const wrong=`<button onclick="toast('Coba lagi. Hubungkan simbol dengan larangan atau perintahnya.')">${s.wrong}</button>`;

  modal(`
    <span class="eyebrow">Sign Hunter · ${signIndex+1}/3</span>
    <h2>Rambu apa yang kamu temukan?</h2>
    <div class="scene-emoji">🌳　${s.symbol}　🏠</div>
    <p>Pilih tindakan yang sesuai.</p>
    <div class="choices">${signIndex%2===0 ? correct+wrong : wrong+correct}</div>`);
}

function correctSign() {
  signIndex++;
  if(signIndex>=3) academyComplete("sign");
  else showSign();
}

function findDanger(index,dangerous,button) {
  if(!dangerous){
    toast("Objek ini berada di luar jalur dan bukan bahaya pada adegan ini.");
    return;
  }

  dangerFound.add(index);
  button.classList.add("found");

  const messages={
    0:"Pintu dapat terbuka ke jalur kendaraan. Beri jarak yang cukup.",
    2:"Bola bisa diikuti anak. Perlambat dan amati sekitar.",
    3:"Permukaan licin dapat mengurangi kendali kendaraan."
  };

  $("#academyInfo").textContent=dangerFound.size+"/3 · "+messages[index];

  if(dangerFound.size===3){
    $("#academyFinish").innerHTML=`
      <button class="btn" onclick="academyComplete('danger')">Selesaikan latihan →</button>`;
  }
}

function puzzleAction(action) {
  if(action==="both"){
    puzzleStep=0;
    $("#junction").textContent="⚠️　Konflik arus　⚠️";
    $("#academyInfo").textContent="Kedua arus berpotongan. Semua kendaraan dihentikan. Mulai kembali dari A.";
    return;
  }

  if(puzzleStep===0&&action==="A"){
    puzzleStep=1;
    $("#junction").textContent="A 🚙 →　　🚕 B menunggu";
    $("#academyInfo").textContent="Arus A telah melintas. Pilih semua merah untuk mengosongkan simpang.";
  }else if(puzzleStep===1&&action==="red"){
    puzzleStep=2;
    $("#junction").textContent="🔴　Simpang kosong　🔴";
    $("#academyInfo").textContent="Simpang sudah kosong. Sekarang beri hijau ke B.";
  }else if(puzzleStep===2&&action==="B"){
    academyComplete("puzzle");
  }else{
    $("#academyInfo").textContent="Urutan latihan: A → semua merah → B.";
  }
}

function academyComplete(type) {
  const first=!state.academy[type];
  state.academy[type]=true;
  if(first) state.coins+=50;

  saveState();
  confetti();

  const lessons={
    sign:"Rambu memberi informasi, larangan, atau perintah. Hubungkan simbol dengan tindakan sebelum tiba di titik konflik.",
    danger:"Antisipasi pintu terbuka, anak yang mungkin mengejar bola, dan jalan licin. Perlambat sebelum bahaya terlalu dekat.",
    puzzle:"Memisahkan arus yang berkonflik dan memberi waktu pengosongan membantu mencegah tabrakan. Ini simulasi edukasi, bukan alat pengaturan jalan nyata."
  };

  modal(`
    ${kiro()}
    <h2>Pelajaran kecil, dampak besar!</h2>
    <p>${lessons[type]}</p>
    <div class="notice">
      ${first ? "+50 Guardian Coins!" : "Latihan selesai ulang. Hadiah sudah pernah diklaim."}
    </div>
    <button class="btn" onclick="closeModal();render()">Kembali ke Academy</button>`);
}

function buyItem(item) {
  if(item==="garden"){
    state.theme="garden";
  }

  if(item==="night"){
    if(!state.ownedNight){
      if(state.coins<200){
        toast("Butuh 200 coins. Selesaikan misi atau Road Academy.");
        return;
      }
      state.coins-=200;
      state.ownedNight=true;
    }
    state.theme="night";
  }

  if(item==="gold"){
    if(!state.ownedGold){
      if(state.coins<150){
        toast("Butuh 150 coins untuk Golden KIRO.");
        return;
      }
      state.coins-=150;
      state.ownedGold=true;
    }
    state.kiroGold=!state.kiroGold;
  }

  saveState();
  closeModal();
  render();
  toast("Gaya Guardian diperbarui!");
}

        event.preventDefault();
        last.focus();
      }else if(!event.shiftKey&&document.active
